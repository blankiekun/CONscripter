name: build kobo (koreader)
on:
  push: {tags:  ['v*']} #  Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_kobo:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: prepare enviroment
      run: |
        sudo rm -f /var/lib/man-db/auto-update # no man page index rebuild after installing
        sudo apt-get update
        sudo apt-get -y install --no-install-recommends crossbuild-essential-armhf autoconf automake libtool pkg-config

    # the ports only change with the recipes: on a hit, cross_kobo.sh skips them
    - name: cache ports
      id: ports
      uses: actions/cache@v4
      with:
        path: thirdparty/build/arch_kobo
        key: kobo-ports-${{ hashFiles('script/_fetch.sh', 'script/_linuxa32.sh', 'script/_kobo.sh', 'script/cross_kobo.sh') }}

    # no prebuilt ports: SDL2 without X11/GL, FBInk and ffmpeg are the Kobo's own
    - name: build conscripter_kobo
      run: |
        if [ "${{ github.ref_type }}" = tag ]; then
          sed -i -E 's/#define CONSCRIPTER_VERSION "(.+?)"/#define CONSCRIPTER_VERSION "${{  github.ref_name }}"/g' src/cons/version.h
        fi
        cd script
        if [ "${{ steps.ports.outputs.cache-hit }}" = true ]; then export SKIP_PORTS=1; fi
        bash cross_kobo.sh
        test -f ../build_kobo/conscripter

    # unzipped at the root of the Kobo's storage
    - name: prepare release
      if: github.ref_type == 'tag'
      run: |
        mkdir -p kobo/.adds/conscripter
        cp build_kobo/conscripter thirdparty/build/arch_kobo/bin/ffmpeg src/cons_kobo/play.sh kobo/.adds/conscripter/
        cd kobo && zip -r ../conscripter_${{  github.ref_name }}_kobo_koreader.zip .adds

    - name: create release
      uses: ncipollo/release-action@v1
      if: github.ref_type == 'tag'
      with:
        artifacts: "conscripter_*_kobo_koreader.zip"
        allowUpdates: "true"
        omitBodyDuringUpdate: "true" # keep the release notes written by hand
        token: ${{ secrets.GITHUB_TOKEN }}
