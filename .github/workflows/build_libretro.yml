name: build libretro (consoles)
on:
  push: {tags:  ['v*']} #  Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # RetroArch on Switch links each core into its own .nro, which goes in /retroarch/cores/
  build_libretro_switch:
    runs-on: ubuntu-22.04
    container: devkitpro/devkita64:20260219
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: build the core
      run: |
        cmake -S src/cons_libretro -B build_nx -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Switch.cmake \
          -DLIBRETRO_STATIC=ON -DLIBRETRO_SUFFIX=_libnx -DCMAKE_BUILD_TYPE=Release
        make -C build_nx -j$(nproc)

    - name: link it into RetroArch
      run: |
        git clone --depth 1 -b v1.22.2 https://github.com/libretro/RetroArch.git retroarch
        cp build_nx/conscripter_libretro_libnx.a retroarch/libretro_libnx.a
        make -C retroarch -f Makefile.libnx APP_TITLE=CONscripter LIBRETRO=conscripter -j$(nproc) > retroarch.log 2>&1 || { tail -n 40 retroarch.log; exit 1; }
        mv retroarch/retroarch_switch.nro conscripter_libretro_libnx.nro
        ls -l conscripter_libretro_libnx.nro

    - uses: actions/upload-artifact@v4
      with:
        name: conscripter_libretro_libnx
        path: conscripter_libretro_libnx.nro

    - name: create release
      uses: ncipollo/release-action@v1
      if: github.ref_type == 'tag'
      with:
        artifacts: "conscripter_libretro_libnx.nro"
        allowUpdates: "true"
        omitBodyDuringUpdate: "true" # keep the release notes written by hand
        token: ${{ secrets.GITHUB_TOKEN }}

  # RetroArch on Vita loads cores as .self files from its app folder (ux0:/app/RETROVITA/)
  build_libretro_vita:
    runs-on: ubuntu-22.04
    container: vitasdk/vitasdk:2026.08-20261015.2
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: build the core
      run: |
        cmake -S src/cons_libretro -B build_vita -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake \
          -DLIBRETRO_STATIC=ON -DLIBRETRO_SUFFIX=_vita -DCMAKE_BUILD_TYPE=Release
        make -C build_vita -j$(nproc)

    # RetroArch 1.22.2's vita2d driver predates GCC 15's incompatible-pointer-types error
    - name: link it into RetroArch
      run: |
        git clone --depth 1 -b v1.22.2 https://github.com/libretro/RetroArch.git retroarch
        cp build_vita/conscripter_libretro_vita.a retroarch/libretro_vita.a
        CFLAGS=-Wno-incompatible-pointer-types make -C retroarch -f Makefile.vita -j$(nproc) retroarch_vita.self > retroarch.log 2>&1 || { tail -n 40 retroarch.log; exit 1; }
        mv retroarch/retroarch_vita.self conscripter_libretro_vita.self
        ls -l conscripter_libretro_vita.self

    - uses: actions/upload-artifact@v4
      with:
        name: conscripter_libretro_vita
        path: conscripter_libretro_vita.self

    - name: create release
      uses: ncipollo/release-action@v1
      if: github.ref_type == 'tag'
      with:
        artifacts: "conscripter_libretro_vita.self"
        allowUpdates: "true"
        omitBodyDuringUpdate: "true" # keep the release notes written by hand
        token: ${{ secrets.GITHUB_TOKEN }}
