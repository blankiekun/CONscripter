name: build libretro (consoles)
on:
  push: {tags:  ['v*']} #  Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # RetroArch on Switch links each core into its own .nro, which goes in /retroarch/cores/
  build_libretro_switch:
    runs-on: ubuntu-22.04
    container: devkitpro/devkita64:20260219
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: build the core
      run: |
        cmake -S src/cons_libretro -B build_nx -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Switch.cmake \
          -DLIBRETRO_STATIC=ON -DLIBRETRO_SUFFIX=_libnx -DCMAKE_BUILD_TYPE=Release
        make -C build_nx -j$(nproc)

    - name: link it into RetroArch
      run: |
        git clone --depth 1 -b v1.22.2 https://github.com/libretro/RetroArch.git retroarch
        cp build_nx/conscripter_libretro_libnx.a retroarch/libretro_libnx.a
        make -C retroarch -f Makefile.libnx APP_TITLE=CONscripter LIBRETRO=conscripter -j$(nproc) > retroarch.log 2>&1 || { tail -n 40 retroarch.log; exit 1; }
        mv retroarch/retroarch_switch.nro conscripter_libretro_libnx.nro
        ls -l conscripter_libretro_libnx.nro

    - uses: actions/upload-artifact@v4
      with:
        name: conscripter_libretro_libnx
        path: conscripter_libretro_libnx.nro

    - name: create release
      uses: ncipollo/release-action@v1
      if: github.ref_type == 'tag'
      with:
        artifacts: "conscripter_libretro_libnx.nro"
        allowUpdates: "true"
        omitBodyDuringUpdate: "true" # keep the release notes written by hand
        token: ${{ secrets.GITHUB_TOKEN }}

  # Miyoo Mini (Onion OS, MiyooMini+): a Linux ARMv7 core .so against the device's glibc 2.28
  build_libretro_miyoo:
    runs-on: ubuntu-22.04
    container: aemiii91/miyoomini-toolchain@sha256:e5123590ad75d27f0f4c91196e3119a255cad45f3ae15243e29a8e0a2ec50132
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # the image's CMake is 3.13; the core needs 3.14 (file(CREATE_LINK))
    - name: build the core
      run: |
        wget -qO- https://github.com/Kitware/CMake/releases/download/v3.31.8/cmake-3.31.8-linux-x86_64.tar.gz | tar xz -C /opt
        T=/opt/miyoomini-toolchain/bin/arm-linux-gnueabihf-
        F="-marm -mtune=cortex-a7 -mcpu=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard"
        /opt/cmake-3.31.8-linux-x86_64/bin/cmake -S src/cons_libretro -B build_miyoo -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=arm \
          -DCMAKE_C_COMPILER=${T}gcc -DCMAKE_CXX_COMPILER=${T}g++ "-DCMAKE_C_FLAGS=$F" "-DCMAKE_CXX_FLAGS=$F" \
          "-DCMAKE_SHARED_LINKER_FLAGS=-static-libstdc++ -static-libgcc" -DCMAKE_BUILD_TYPE=Release
        make -C build_miyoo -j$(nproc)
        ${T}strip build_miyoo/conscripter_libretro.so
        mv build_miyoo/conscripter_libretro.so conscripter_libretro_miyoo.so

    - uses: actions/upload-artifact@v4
      with:
        name: conscripter_libretro_miyoo
        path: conscripter_libretro_miyoo.so

    - name: create release
      uses: ncipollo/release-action@v1
      if: github.ref_type == 'tag'
      with:
        artifacts: "conscripter_libretro_miyoo.so"
        allowUpdates: "true"
        omitBodyDuringUpdate: "true" # keep the release notes written by hand
        token: ${{ secrets.GITHUB_TOKEN }}

  # RetroArch on Vita loads cores as .self files from its app folder (ux0:/app/RETROVITA/)
  build_libretro_vita:
    runs-on: ubuntu-22.04
    container: vitasdk/vitasdk:2026.08-20261015.2
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: build the core
      run: |
        cmake -S src/cons_libretro -B build_vita -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake \
          -DLIBRETRO_STATIC=ON -DLIBRETRO_SUFFIX=_vita -DCMAKE_BUILD_TYPE=Release
        make -C build_vita -j$(nproc)

    # RetroArch 1.22.2's vita2d driver predates GCC 15's incompatible-pointer-types error
    - name: link it into RetroArch
      run: |
        git clone --depth 1 -b v1.22.2 https://github.com/libretro/RetroArch.git retroarch
        cp build_vita/conscripter_libretro_vita.a retroarch/libretro_vita.a
        CFLAGS=-Wno-incompatible-pointer-types make -C retroarch -f Makefile.vita -j$(nproc) retroarch_vita.self > retroarch.log 2>&1 || { tail -n 40 retroarch.log; exit 1; }
        mv retroarch/retroarch_vita.self conscripter_libretro_vita.self
        ls -l conscripter_libretro_vita.self

    - uses: actions/upload-artifact@v4
      with:
        name: conscripter_libretro_vita
        path: conscripter_libretro_vita.self

    - name: create release
      uses: ncipollo/release-action@v1
      if: github.ref_type == 'tag'
      with:
        artifacts: "conscripter_libretro_vita.self"
        allowUpdates: "true"
        omitBodyDuringUpdate: "true" # keep the release notes written by hand
        token: ${{ secrets.GITHUB_TOKEN }}

  # RetroArch on Wii U (Aroma) loads cores as .rpx files from sd:/retroarch/cores/
  build_libretro_wiiu:
    runs-on: ubuntu-22.04
    container: devkitpro/devkitppc:20260503
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: build the core
      run: |
        cmake -S src/cons_libretro -B build_wiiu -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/WiiU.cmake \
          -DLIBRETRO_STATIC=ON -DLIBRETRO_SUFFIX=_wiiu -DCMAKE_BUILD_TYPE=Release
        make -C build_wiiu -j$(nproc)

    # RetroArch's elf2rpl needs zlib; its last step compresses with wiiurpxtool,
    # a Windows tool that builds on Linux once <io.h> is <cstdio>
    - name: link it into RetroArch
      run: |
        apt-get update -qq && apt-get install -y -qq zlib1g-dev g++ > /dev/null
        git clone -q https://github.com/0CBH0/wiiurpxtool.git rpxtool
        git -C rpxtool checkout -q 6ff41a43201dcfa126b4b00379db39e94de64037
        sed -i 's/#include <io.h>/#include <cstdio>/' rpxtool/wiiurpxtool.cpp
        g++ -O2 -o /usr/local/bin/wiiurpxtool rpxtool/wiiurpxtool.cpp -lz
        git clone --depth 1 -b v1.22.2 https://github.com/libretro/RetroArch.git retroarch
        cp build_wiiu/conscripter_libretro_wiiu.a retroarch/libretro_wiiu.a
        make -C retroarch -f Makefile.wiiu -j$(nproc) BUILD_HBL_ELF=0 > retroarch.log 2>&1 || { tail -n 40 retroarch.log; exit 1; }
        mv retroarch/retroarch_wiiu.rpx conscripter_libretro_wiiu.rpx
        ls -l conscripter_libretro_wiiu.rpx

    - uses: actions/upload-artifact@v4
      with:
        name: conscripter_libretro_wiiu
        path: conscripter_libretro_wiiu.rpx

    - name: create release
      uses: ncipollo/release-action@v1
      if: github.ref_type == 'tag'
      with:
        artifacts: "conscripter_libretro_wiiu.rpx"
        allowUpdates: "true"
        omitBodyDuringUpdate: "true" # keep the release notes written by hand
        token: ${{ secrets.GITHUB_TOKEN }}
