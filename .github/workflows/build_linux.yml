name: build linux x86, x64, arm32, arm64
on:
  push: {tags:  ['v*']} #  Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request: 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_linux:
    strategy:
      matrix: 
        arch:
          - {suffix2: 32, suffix: x86, packages: crossbuild-essential-i386}
          - {suffix2: 64, suffix: x64, packages: ''} # the runner's own gcc
          - {suffix2: a32, suffix: arm32, packages: crossbuild-essential-armhf}
          - {suffix2: a64, suffix: arm64, packages: crossbuild-essential-arm64}
    
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    
    - name: download thirdparty_build
      run: |
        curl -fsSL https://github.com/YuriSizuku/OnscripterYuri/releases/download/v0.6/thirdparty_build.tar.gz -O
        tar xzf thirdparty_build.tar.gz
    
    - name: prepare enviroment
      if: matrix.arch.packages != ''
      run: |
        sudo rm -f /var/lib/man-db/auto-update # no man page index rebuild after installing
        sudo apt-get update
        sudo apt-get -y install --no-install-recommends ${{ matrix.arch.packages }}
    
    - name: build conscripter_${{ matrix.arch.suffix }}_linux
      run: |
        if [ "${{ github.ref_type }}" = tag ]; then 
          sed -i -E 's/#define CONSCRIPTER_VERSION "(.+?)"/#define CONSCRIPTER_VERSION "${{  github.ref_name }}"/g' src/cons/version.h
        fi
        cd script
        SKIP_PORTS=yes bash cross_linux${{ matrix.arch.suffix2 }}.sh

    - name: pixel test
      if: matrix.arch.suffix == 'x64'
      run: python3 -I tests/pixel/check.py build_linux64/conscripter

    - name: label variants test
      if: matrix.arch.suffix == 'x64'
      run: python3 -I tests/labels/check.py build_linux64/conscripter

    - name: language test
      if: matrix.arch.suffix == 'x64'
      run: python3 -I tests/language/check.py build_linux64/conscripter
    
    - name: prepare release
      if: github.ref_type == 'tag'
      run: |
        cd build_linux${{ matrix.arch.suffix2 }}
        mv conscripter conscripter_${{  github.ref_name }}_${{ matrix.arch.suffix }}_linux
      
    - name: create release
      uses: ncipollo/release-action@v1
      if: github.ref_type == 'tag'
      with:
        artifacts: "build_linux${{ matrix.arch.suffix2 }}/conscripter_*"
        allowUpdates: "true"
        omitBodyDuringUpdate: "true" # keep the release notes written by hand
        token: ${{ secrets.GITHUB_TOKEN }}
