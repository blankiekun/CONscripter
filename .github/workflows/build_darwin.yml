name: build MacOS
on:
  push: {tags:  ['v*']} #  Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_darwin_universal:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build (arm64 + x86_64, static ports)
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            sed -i '' -E 's/#define CONSCRIPTER_VERSION "(.+)"/#define CONSCRIPTER_VERSION "${{ github.ref_name }}"/g' src/cons/version.h
          fi
          cd script
          bash ./cross_darwin.sh

      - name: Check libraries, minimum macOS and both slices
        run: |
          B=build_darwin/conscripter
          lipo -info $B
          otool -L $B
          if otool -L $B | grep -E '/opt/homebrew|/usr/local|@rpath'; then echo "links outside macOS"; exit 1; fi
          for A in arm64 x86_64; do
            echo "$A: $(vtool -arch $A -show-build $B | grep -E 'minos|version' | head -1)"
          done
          brew install coreutils # timeout, for the test only
          softwareupdate --install-rosetta --agree-to-license || true
          FONT=/System/Library/Fonts/Supplemental/Arial.ttf
          for A in arm64 x86_64; do
            lipo -thin $A $B -output conscripter_$A
            echo "pixel test $A"; python3 -I tests/pixel/check.py conscripter_$A $FONT
          done

      - name: prepare release
        if: github.ref_type == 'tag'
        run: |
          cd build_darwin
          cp conscripter conscripter_${{ github.ref_name }}_universal_darwin
          # the name the converter's GUI downloaded before 0.29: the same file
          cp conscripter conscripter_${{ github.ref_name }}_aarch64_darwin

      - name: create release
        uses: ncipollo/release-action@v1
        if: github.ref_type == 'tag'
        with:
          artifacts: "./build_darwin/conscripter_*_darwin"
          allowUpdates: "true"
          omitBodyDuringUpdate: "true" # keep the release notes written by hand
          token: ${{ secrets.GITHUB_TOKEN }}
