name: build web
on:
  push:
    tags: ['v*'] #  Push events to matching v*, i.e. v1.0, v20.15.10
    # runs on master only when the build changes, to refresh the cache tags read
    branches: [master]
    paths: ['.github/workflows/build_web.yml', 'script/cross_web.sh', 'script/_fetch.sh']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  EMSDK_HOME: /opt/emsdk
  EMSDK_VERSION: 6.0.12
  BUILD_NAME: conscripter_web

jobs:
  build_web:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    # emsdk, the ports emcc generates while building (LTO variants included)
    # and Lua/libwebp; saved after the build, so a hit needs no port builds.
    # A tag can only read caches saved on master.
    - name: get emsdk and ports cache
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.EMSDK_HOME }}
          thirdparty/build/arch_wasm
          thirdparty/port
        key: emsdk-${{ env.EMSDK_VERSION }}-${{ hashFiles('script/cross_web.sh', 'script/_fetch.sh') }}
        restore-keys: emsdk-${{ env.EMSDK_VERSION }}-

    - name: install emsdk
      run: |
        if ! [ -f ${{ env.EMSDK_HOME }}/emsdk ]; then
          git clone https://github.com/emscripten-core/emsdk.git ${{ env.EMSDK_HOME }}
        fi
        cd ${{ env.EMSDK_HOME }}
        ./emsdk install ${{ env.EMSDK_VERSION }} && ./emsdk activate ${{ env.EMSDK_VERSION }}

    - name: build conscripter_web
      run: |
        if [ "${{ github.ref_type }}" = tag ]; then
          sed -i -E 's/#define CONSCRIPTER_VERSION "(.+?)"/#define CONSCRIPTER_VERSION "${{  github.ref_name }}"/g' src/cons/version.h
        fi
        cd script
        bash ./cross_web.sh

    # plays tests/web/0.txt in headless Chrome and checks the page hooks, in Shift-JIS and in UTF-8
    - name: web smoke test
      run: |
        python3 -I tests/web/smoke.py build_web
        python3 -I tests/web/smoke.py build_web --enc:utf8

    - name: prepare release
      if: github.ref_type == 'tag'
      run: |
        cd build_web
        mkdir ${{ env.BUILD_NAME }}
        cp conscripter{.html,.js,.wasm} ${{ env.BUILD_NAME }}/
        cp conscripter_index.py ${{ env.BUILD_NAME }}/
        7z a -t7z -mtc=on -ms=off -mx=5 -m0=lzma2 ${{ env.BUILD_NAME }}.7z ${{ env.BUILD_NAME }}
        mv ${{ env.BUILD_NAME }}.7z conscripter_${{  github.ref_name }}_web.7z

    - name: create release
      uses: ncipollo/release-action@v1
      if: github.ref_type == 'tag'
      with:
        artifacts: "./build_web/conscripter_${{  github.ref_name }}_web.7z"
        allowUpdates: "true"
        omitBodyDuringUpdate: "true" # keep the release notes written by hand
        token: ${{ secrets.GITHUB_TOKEN }}
