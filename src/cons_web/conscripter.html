        <meta charset="utf-8">

    <body style="margin: 0 auto; background-color:black;">
        <canvas id="canvas" oncontextmenu="event.preventDefault()" style="margin: 0 auto; display: block;"></canvas> 
        <video id="video" onended="videoEnded()" style="margin: 0 auto; display: none;"></video>        
        <script type="text/javascript"> // browser universe function
            function scale_full(docobj, ratio=0) {
                var w = window.innerWidth;
                var h = window.innerHeight;
                if(ratio>0) {
                    if(w/h > ratio) {
                        docobj.style.width  = h * ratio  + "px";
                        docobj.style.height = h + "px";
                    }
                    else {
                        docobj.style.width  = w  + "px";
                        docobj.style.height = w / ratio + "px";
                    }
                }
                else {
                    docobj.style.width  = w + "px";
                    docobj.style.height = h + "px";
                }
                return {w: docobj.style.width, h: docobj.style.height}
            }
            
            async function delay(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            async function send_worker(worker, data) {
                worker.postMessage(data);
                return new Promise((res)=>{
                    worker.onmessage = (event)=>{
                        res(event.data);
                    };
                })
            };

            async function load_json(url) {
                return new Promise((res)=>{
                    fetch(url).then((res)=>res.json())
                    .then((json)=>(res(json)));
                })
            }

            async function load_js(url) {
                var script = document.createElement('script');
                script.type = "text/javascript";
                script.src = url;
                document.getElementsByTagName("body")[0].appendChild(script);
                return new Promise((res)=>{
                    script.onload = () =>{
                        res(1);
                    }
                })
            }

            async function download_data (name, data) {
                var blob = new Blob([data], {type:'application/octet-stream'});
                var e = document.createEvent('MouseEvents');
                var a = document.createElement('a');
                a.download = name;
                a.href = window.URL.createObjectURL(blob);
                a.dataset.downloadurl = ['application/octet-stream', a.download, a.href].join(':');
                e.initMouseEvent('click', true, false, window, 0, 0, 0, 0, 0, false, false, false, false, 0, null);
                a.dispatchEvent(e);
            }

            async function upload_data() {
                return new Promise((res, rej) => {
                    var i = document.createElement('input');
                    i.type = 'file';
                    i.addEventListener('change', () => {
                        var file = i.files[0];
                        var reader = new FileReader();
                        reader.onload = (e) => {
                            return res(e.target.result)
                        };
                        reader.readAsArrayBuffer(file);
                    });
                    i.click(); //can not open without user click
                });
            }
        </script>
        
        <script type="text/javascript" src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
        <script type="text/javascript"> // cons web function 
            function em_mkdirs(_FS, path) {
                var tmpdir="";
                var arr = path.split('/');
                for(i in arr)
                {
                    tmpdir += arr[i] +"/";
                    if(arr[i]=="") continue;
                    try{
                        _FS.mkdir(tmpdir);
                    }
                    catch{};
                }
            }

            function em_lsfiles(_FS, top) {
                var files = [];
                var paths = _FS.readdir(top);
                for(let i=0; i < paths.length; i++) {
                    paths[i] = top + "/" + paths[i];
                }
                while(paths.length > 0) {
                    path = paths.pop();
                    if(path.endsWith(".") || path.endsWith("..")) continue;
                    const stat = _FS.stat(path);
                    if (_FS.isDir(stat.mode)) {
                        let tmppaths = _FS.readdir(path);
                        for (let i=0; i<tmppaths.length; i++) {
                            paths.push(path + "/" + tmppaths[i]);
                        }
                    }
                    else if (_FS.isFile(stat.mode)) {
                        files.push(path);   
                    }
                    else if (_FS.isLink(stat.mode)) {
                        // not consider symbol link here
                    }
                }
                return files;
            }

            function em_export(_FS, paths, name="export.zip") {
                var zip = new JSZip();
                for (let i=0; i<paths.length; i++) {
                    var data = _FS.readFile(paths[i]);
                    zip.file(paths[i], data, {binary: true});
                    console.log("## cons_fs: em_export", paths[i]);
                }
                zip.generateAsync({type : "arraybuffer"})
                .then(function(data) {
                    download_data(name, data);
                });
            }

            function em_import(_FS, data) {
                JSZip.loadAsync(data)
                .then((zip) => {
                    zip.forEach((path, obj) => {
                        if(obj.dir) {
                            em_mkdirs(_FS, path);
                        }
                        else {
                            obj.async("arraybuffer")
                            .then((buf) => {
                                _FS.writeFile(path, new Uint8Array(buf));
                                console.log("## cons_fs: em_import", path);
                            });
                        }
                    });
                })
            }

            // mount --gamedir other by preload or lazyload
            function mount_game(_FS, gamedir, files, urlbase="", lazyload=false) {
                console.log("## cons_fs: mount_onsgame", gamedir);
                var filemap = {}
                
                if(gamedir[gamedir.length-1] =="/" ) 
                    gamedir=gamedir.substring(0, gamedir.length-1);

                if(urlbase[urlbase.length-1] == "/")
                    urlbase=urlbase.substring(0, urlbase.length-1);

                for(i in files) {
                    var path = files[i].path;
                    var url = files[i].url;
                    var file_lazyload = files[i].lazyload;
                    var j = path.lastIndexOf("/");
                    var filename =path.substring(j+1);
                    var filedir = path.substring(0, j);
                    var basedir = gamedir + "/" + filedir;
                    if(basedir[basedir.length-1]!="/") basedir+="/";
                    if(url==undefined || url.length==0)
                    {
                        if (path[0]=="/") url = urlbase + path;
                        else url = urlbase + "/" + path;
                    }

                    // console.log(path, url, file_lazyload);
                    em_mkdirs(_FS, basedir);
                    if(file_lazyload==undefined) file_lazyload = lazyload;
                    if(file_lazyload){ // pay attension to the case sensitive!
                        var key = basedir + filename;
                        filemap[key.toLowerCase()] = {url: url, loaded:false};
                    }
                    else {
                        _FS.createPreloadedFile(basedir, filename, url, true, false);
                    }
                }
                return filemap;
            }

            // mount --gamedir using BrowserFS with lazyload, 
            // deprecated as sync block sound problems
            function mount_game2(_module, gamedir, lazyindex, urlbase) {
                console.log("## cons_fs: mount_onsgame2", gamedir);
                var _FS=_module.FS;
                _module.addRunDependency("onsgamefs");
                
                var brewfs =  new BrowserFS.FileSystem.MountableFileSystem();
                var xhrfs = new BrowserFS.FileSystem.XmlHttpRequest(lazyindex, urlbase);
                window.xhrfs = xhrfs;
                window.brewfs = brewfs;
                brewfs.mount('/xhrfs', xhrfs);
                BrowserFS.initialize(brewfs);
                var BREWFS = new BrowserFS.EmscriptenFS(_module.FS, _module.PATH); 
                
                em_mkdirs(_FS, gamedir);
                _FS.mount(BREWFS, {root: "/xhrfs"}, gamedir);
                _module.removeRunDependency("onsgamefs")
            }

            // mount --savedir using IDBFS
            function mount_save(_FS, _IDBFS, savedir) {
                console.log("## cons_fs: mount_onssave", savedir);
                em_mkdirs(_FS, savedir);
                _FS.mount(_IDBFS, {}, savedir);
                _FS.syncfs(true, (err)=>{
                    if(err) console.log(err);
                });
            }
        </script>
        
        <script type="text/javascript"> // cons C interface of val or function
            
            // flush the savedir to IDFBFS for persistence
            function flush_save() { 
                g_cons_module.FS.syncfs(false, (err)=>{
                    if(err) console.log(err);
                    else console.log("## cons_fs: flush_save, sync finished");
                });
            }

            // fetch file from the remote server, and write them to local fs
            async function fetch_file(_FS, path, filemap) {
                var fnode = filemap[path];
                return new Promise((res)=>{
                    if(!fnode){
                        res(0);
                    }
                    else{
                        if(fnode.loaded) res(1);
                        fetch(fnode.url).then( (resp)=>{
                            return resp.arrayBuffer();
                        }).then((data)=>{
                            _FS.writeFile(path, new Uint8Array(data));
                            fnode.loaded = true;
                            res(1);
                        }).catch((err)=>{
                            console.log("## fetch_file ${path}", err);
                            res(-1);
                        })
                    }
                })
            }
    
            const CONS_PREFIX = ""; // prefix for mount, not used 
            const CONS_INDEX_URL = document.querySelector( // the url to load cons_index.json
                'meta[cons_index]').attributes.cons_index.textContent;
            const CONS_JS_URL = document.querySelector(
                'meta[cons_js]').attributes.cons_js.textContent;
            var g_cons_index = {}; // cons_index.json, game file index
            var g_cons_filemap = {}; // filemap to record status of loaded files, used for lazyload
            var g_cons_module  = {}; // cons c module, FS and configure are here

        </script>

        <script type="text/javascript"> // cons module
            // SDL2 plays through a ScriptProcessorNode, which Firefox runs late whenever the main
            // thread is busy (the sound hiccups); pull SDL's callback on a timer instead and queue
            // the chunks ahead as buffer sources, so a stall shorter than the lead goes unheard
            (() => {
                var AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return;
                AC.prototype.createScriptProcessor = function(size, inputs, channels) {
                    var ctx = this, next = 0, timer;
                    var node = {onaudioprocess: null, connect: () => {}, disconnect: () => clearInterval(timer)};
                    timer = setInterval(() => {
                        if (ctx.state !== 'running' || !node.onaudioprocess) return;
                        var lead = document.hidden ? 1.5 : 0.3; // hidden tabs run timers once a second
                        if (next < ctx.currentTime) next = ctx.currentTime + 0.05;
                        while (next < ctx.currentTime + lead) {
                            var buf = ctx.createBuffer(channels, size, ctx.sampleRate);
                            node.onaudioprocess({outputBuffer: buf});
                            var src = ctx.createBufferSource();
                            src.buffer = buf;
                            src.connect(ctx.destination);
                            src.start(next);
                            next += size / ctx.sampleRate;
                        }
                    }, 20);
                    return node;
                };
            })();
            g_cons_module.canvas = (()=>{return document.getElementById('canvas');})();
            g_cons_module.preRun = () => {
                console.log("## cons: preRun");
                var lazyload = false;
                var urlbase = window.location.href;
                urlbase = urlbase.substring(0, urlbase.lastIndexOf("/") + 1);
                
                // lazyindex is deprecated as the sync sound problem
                if(g_cons_index.lazyindex && g_cons_index.lazyindex!=""){
                    mount_onsgame2(g_cons_module, g_cons_index.gamedir, 
                        g_cons_index.lazyindex, urlbase);
                }
                else{
                    lazyload = g_cons_index.lazyload||lazyload;
                    window.g_cons_filemap = mount_game(
                        g_cons_module.FS, g_cons_index.gamedir, 
                        g_cons_index.files, urlbase, lazyload
                    );
                }
                mount_save(g_cons_module.FS, g_cons_module.IDBFS, g_cons_index.savedir);
            };
            g_cons_module.onRuntimeInitialized = () => {
                console.log("## cons: onRuntimeInitialized");
            };
            
            (async() => {
                //return
                g_cons_index = await load_json(CONS_INDEX_URL);
                await load_js(CONS_JS_URL); // dynamic load conscripter.js
                await cons(g_cons_module);

                var args = [
                    "--root", CONS_PREFIX + g_cons_index.gamedir, 
                    "--font",  CONS_PREFIX + g_cons_index.gamedir + "/default.ttf", 
                    "--save-dir", g_cons_index.savedir
                ];
                args = args.concat(g_cons_index.args);
                // the debug trace (DEBUG.md): ?trace, with ?trace-ignore=, ?auto-play=,
                // ?auto-choice=, ?seed=, ?until=, ?max-pages=; the page keeps the records for "trace[F7]"
                var params = new URLSearchParams(window.location.search);
                if(params.has("trace")){
                    args.push("--trace", "/trace.jsonl");
                    self.consTrace = (line) => { g_trace_lines.push(line); };
                    document.getElementById("cons_trace_button").style.display = "";
                }
                for(var name of ["trace-ignore", "auto-play", "auto-choice", "seed", "until", "max-pages"]){
                    if(params.get(name) !== null) args.push("--" + name, params.get(name));
                }
                console.log("## cons: args", args);
                g_cons_module.callMain(args);
            })();
        </script>

        <script type="text/javascript"> // cons ui
            var g_fullstrech = false;
            var g_screen_height, g_screen_width; // initial in the engine's C code
            var g_lastpressdown; // for longpress 
            const LONG_CLICK_TIME = 1200;

            function toggle_stretchfull() {
                g_fullstrech = !g_fullstrech;
                window.dispatchEvent(new Event('resize'));
            }

            function toggle_screenfull() {
                var body = document.getElementsByTagName('body')[0];
                if(window.innerHeight != screen.height) {
                    body.requestFullscreen({ navigationUI: "show" })
                    .then(()=>{ // can not use canvas.requestFullscreen
                        console.log("## after requestFullscreen");
                    });
                }
                else {
                    document.exitFullscreen();
                }
            }

            function toggle_onsmenu(){
                var canvas = document.getElementById('canvas');    
                var event = new KeyboardEvent("keydown", 
                    {bubbles: true, cancelable: true, keyCode: 0x1B}); // ESC key
                canvas.dispatchEvent(event);
                setTimeout(() => {
                    var event = new KeyboardEvent("keyup", 
                    {bubbles: true, cancelable: true, keyCode: 0x1B}); // ESC key
                    canvas.dispatchEvent(event);
                }, 50);
            }

            var g_skip = false;
            function toggle_skip() {
                g_skip = !g_skip;
                var canvas = document.getElementById('canvas');    
                var event = new KeyboardEvent(g_skip ? "keydown": "keyup", 
                    {bubbles: true, cancelable: true, keyCode: 0x11}); // ctrl key
                canvas.dispatchEvent(event);
            }

            function toggle_webinfo() {
                var cons_webinfo = document.getElementById("cons_webinfo");
                if(cons_webinfo.style.display=="none") {
                    var first_line = cons_webinfo.getElementsByTagName("p")[0];
                    first_line.innerText = `In Game <${g_cons_index.title}>`
                    cons_webinfo.style.display="block";
                }
                else{
                    cons_webinfo.style.display="none";
                }
            }

            function toggle_webmenu() {
                var cons_webrmenu = document.getElementById("cons_webrmenu");
                if(cons_webrmenu.style.display=="none") {
                    cons_webrmenu.style.display = "block";
                }
                else {
                    var cons_webinfo = document.getElementById("cons_webinfo");
                    cons_webinfo.style.display = "none";
                    cons_webrmenu.style.display = "none";
                }
            }

            function click_export() {
                var files = em_lsfiles(g_cons_module.FS, g_cons_index.savedir);
                em_export(g_cons_module.FS, files);
            }

            var g_trace_lines = []; // the debug trace's records (?trace)
            function click_trace() {
                if(!g_trace_lines.length) return;
                var blob = new Blob([g_trace_lines.join("\n") + "\n"], {type: "application/x-ndjson"});
                var a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = "trace.jsonl";
                a.click();
                setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            }

            async function click_import() {
                var data = await upload_data();
                em_import(g_cons_module.FS, data);
            }

            window.onresize = (event) => {
                var canvas = document.getElementById('canvas');
                var ratio = g_fullstrech ? window.innerWidth/window.innerHeight: g_screen_width/g_screen_height;
                scale_full(canvas, ratio);
            };

            window.onkeydown = (event) => {
                switch(event.key) {
                    case "F2":
                        toggle_webinfo();
                        break;
                    case "F3":
                        click_export();
                        break;
                    case "F4":
                        click_import();
                        break;
                    case "F7":
                        click_trace();
                        break;
                    case "F9":
                        toggle_webmenu();
                        break;
                    case "F10":
                        toggle_stretchfull();
                        break;
                    case "F11":
                        toggle_screenfull();
                        break;
                }
            }

            window.onmousedown = (event) => {
                if(event.button==0){
                    g_lastpressdown = event.timeStamp;
                }
            }

            window.onmouseup = (event) => {
                if(event.button==0){
                    if(event.timeStamp - g_lastpressdown > LONG_CLICK_TIME) {
                        var cons_webrmenu = document.getElementById("cons_webrmenu");
                        if(cons_webrmenu.style.display=="none") toggle_webmenu();
                        g_lastpressdown = event.timeStamp;
                    }
                }
            }

            window.ontouchstart = (event) => {
                g_lastpressdown = event.timeStamp;
            }

            window.ontouchend = (event) => {
                if(event.timeStamp - g_lastpressdown > LONG_CLICK_TIME) {
                    var cons_webrmenu = document.getElementById("cons_webrmenu");
                    if(cons_webrmenu.style.display=="none") toggle_webmenu();
                    g_lastpressdown = event.timeStamp;
                }
            }

            window.onmessage = (evnet)=> {
                console.log("## cons: onmessage ", event.data);
                if(!event.data) return;
                switch(event.data) {
                    case "onsinit":
                        var body = document.getElementsByTagName("body")[0];
                        var cons_webinfo = document.getElementById("cons_webinfo");
                        if(body) body.style.background = "black";
                        if(cons_webinfo) cons_webinfo.style.display = "none";
                        break;
                }
            }
        </script>
        
        <script type="text/javascript"> // cons video 
            const video=document.getElementById("video");

            // a skipped movie must stop: hiding it and clearing src leaves
            // its sound playing in some browsers
            var g_video_skippable=false;
            function videoSkipped(){
                g_cons_module.video_skipped=true;
                videoEnded();
            }
            function videoEnded(){
                holdEnded();
                g_video_skippable=false;
                video.onclick=null;
                video.pause();
                g_cons_module.canvas.style.display="block";
                video.style.display="none";
                if (video.src && video.src.startsWith('blob:')) {
                    URL.revokeObjectURL(video.src);
                }
                video.removeAttribute('src');
                video.load();
                g_cons_module.wait_video=false;
            }

            // Enter, Space and Escape skip it, as in the native player
            window.addEventListener('keyup', function(event) {
                if (g_video_skippable && (event.key=="Enter" || event.key==" " || event.key=="Escape")) videoSkipped();
            });

            function playVideo(path, click_flag, loop_flag){
                g_cons_module.wait_video=true;
                g_cons_module.video_skipped=false;
                const fileData = g_cons_module.FS.readFile(path, {flags:'r',encoding:'binary'});
                const videoBlob = new Blob([fileData.buffer], { type: 'video/mp4' });
                const videoUrl = URL.createObjectURL(videoBlob);
                video.src = videoUrl;

                // the same size as the game on the page
                const canvas=g_cons_module.canvas;
                video.style.width=canvas.style.width||canvas.clientWidth+"px";
                video.style.height=canvas.style.height||canvas.clientHeight+"px";
                canvas.style.display="none";
                video.style.display="block";

                video.onclick=click_flag?videoSkipped:null;
                g_video_skippable=!!click_flag;
                video.loop=loop_flag;

                // browsers block autoplay with sound until the page was clicked;
                // play muted then, rather than wait forever
                video.muted=false;
                video.play().catch(()=>{
                    video.muted=true;
                    video.play().catch(videoEnded);
                });
            }

            // mpeghold: the video plays while the pointer, Enter or Space
            // is held down on it, under the engine's sprite (a "hold the
            // button" prompt); g_cons_module.video_held tells the engine
            const holdOverlay=document.createElement("canvas");
            holdOverlay.style.cssText="position:absolute; display:none; touch-action:none;";
            document.body.appendChild(holdOverlay);
            var g_hold=null;
            function holdSet(){
                if (!g_hold) return;
                const down=g_hold.pointers.size>0 || g_hold.keys.size>0;
                if (down==!!g_cons_module.video_held) return;
                g_cons_module.video_held=down;
                if (down) video.play().catch(()=>{ video.muted=true; video.play().catch(()=>{}); });
                else video.pause();
            }
            function holdKey(event){
                if (!g_hold || !(event.key=="Enter" || event.key==" ")) return;
                event.preventDefault();
                if (event.type=="keydown") g_hold.keys.add(event.key); else g_hold.keys.delete(event.key);
                holdSet();
            }
            window.addEventListener('keydown', holdKey);
            window.addEventListener('keyup', holdKey);
            holdOverlay.addEventListener('pointerdown', function(event){
                if (!g_hold || event.button>0) return;
                holdOverlay.setPointerCapture(event.pointerId);
                g_hold.pointers.add(event.pointerId);
                holdSet();
            });
            for (const name of ['pointerup', 'pointercancel', 'lostpointercapture'])
                holdOverlay.addEventListener(name, function(event){
                    if (!g_hold) return;
                    g_hold.pointers.delete(event.pointerId);
                    holdSet();
                });
            holdOverlay.addEventListener('contextmenu', (event)=>event.preventDefault());
            window.addEventListener('blur', function(){
                if (!g_hold) return;
                g_hold.pointers.clear();
                g_hold.keys.clear();
                holdSet();
            });

            // rgba: the sprite's picture (w x h, stride px a row), cells side
            // by side, each shown ms; drawn at x,y of the sw x sh screen
            function playVideoHold(path, rgba, w, h, stride, cells, ms, x, y, sw, sh){
                g_cons_module.wait_video=true;
                g_cons_module.video_held=false;
                g_cons_module.video_hold_end=0;
                const fileData = g_cons_module.FS.readFile(path, {flags:'r',encoding:'binary'});
                video.src = URL.createObjectURL(new Blob([fileData.buffer], { type: 'video/mp4' }));
                video.loop=false;
                video.muted=false;
                video.onclick=null;
                g_video_skippable=false;
                video.preload="auto";
                video.pause();

                const canvas=g_cons_module.canvas;
                video.style.width=canvas.style.width||canvas.clientWidth+"px";
                video.style.height=canvas.style.height||canvas.clientHeight+"px";
                canvas.style.display="none";
                video.style.display="block";
                const r=video.getBoundingClientRect();
                Object.assign(holdOverlay.style, {left:(r.left+window.scrollX)+"px", top:(r.top+window.scrollY)+"px",
                                                  width:r.width+"px", height:r.height+"px", display:"block"});
                holdOverlay.width=sw;
                holdOverlay.height=sh;
                const ctx=holdOverlay.getContext("2d");
                ctx.clearRect(0, 0, sw, sh);
                g_hold={pointers:new Set(), keys:new Set(), timer:null};
                if (rgba && w>0 && h>0){
                    const image=new ImageData(w, h);
                    for (let row=0; row<h; row++)
                        image.data.set(rgba.subarray(row*stride*4, row*stride*4 + w*4), row*w*4);
                    const cw=Math.floor(w/Math.max(cells,1));
                    let cell=0;
                    const draw=()=>{
                        ctx.clearRect(0, 0, sw, sh);
                        ctx.putImageData(image, x - cell*cw, y, cell*cw, 0, cw, h);
                        cell=(cell+1)%Math.max(cells,1);
                    };
                    draw();
                    if (cells>1 && ms>0) g_hold.timer=setInterval(draw, ms);
                }
            }
            function holdEnded(){
                if (!g_hold) return;
                g_cons_module.video_hold_end=(g_hold.pointers.size>0 ? 1 : 0) | (g_hold.keys.has("Enter") ? 2 : 0) | (g_hold.keys.has(" ") ? 8 : 0);
                if (g_hold.timer) clearInterval(g_hold.timer);
                g_hold=null;
                g_cons_module.video_held=false;
                holdOverlay.style.display="none";
            }

            // CONscripter: movies whose frames the engine draws (a movie as a
            // picture; mpegplay under the text window): a hidden <video> each,
            // its current frame read through a canvas as RGBA bytes
            var g_cons_movies={}, g_cons_movie_id=0;
            function consMovieOpen(path, loop, sound, w, h){
                var data;
                try { data=g_cons_module.FS.readFile(path, {flags:'r',encoding:'binary'}); }
                catch(e){ console.error('no movie '+path); return -1; }
                const v=document.createElement('video');
                const id=++g_cons_movie_id;
                const m={video:v, state:0, last:-1, w:w, h:h, ctx:null};
                v.muted=!sound; v.loop=!!loop; v.playsInline=true; v.preload='auto';
                // in the page (a detached or hidden video may not decode), unseen
                v.style.cssText='position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none';
                v.onloadeddata=function(){ if (m.state==0) m.state=1; };
                v.onerror=function(){ m.state=-1; };
                v.src=URL.createObjectURL(new Blob([data.buffer]));
                document.body.appendChild(v);
                v.play().catch(function(){ v.muted=true; v.play().catch(function(){ m.state=-1; }); });
                g_cons_movies[id]=m;
                return id;
            }
            function consMovieState(id){ const m=g_cons_movies[id]; return m ? m.state : -1; }
            // the frame as RGBA bytes when it changed since the last call, else null
            function consMovieFrame(id, w, h){
                const m=g_cons_movies[id];
                if (!m || m.video.readyState<2 || m.video.currentTime===m.last) return null;
                m.last=m.video.currentTime;
                if (!m.ctx){
                    const c=document.createElement('canvas');
                    c.width=w; c.height=h;
                    m.ctx=c.getContext('2d', {willReadFrequently:true});
                }
                m.ctx.drawImage(m.video, 0, 0, w, h);
                return m.ctx.getImageData(0, 0, w, h).data;
            }
            function consMovieEnded(id){ const m=g_cons_movies[id]; return !m || m.state<0 || m.video.ended ? 1 : 0; }
            function consMovieClose(id){
                const m=g_cons_movies[id];
                if (!m) return;
                const v=m.video;
                v.pause();
                if (v.src && v.src.startsWith('blob:')) URL.revokeObjectURL(v.src);
                v.removeAttribute('src');
                v.load();
                v.remove();
                delete g_cons_movies[id];
            }

            video.addEventListener('error', function(event) {
                console.error('The video failed to load: ', event);
                videoEnded();
            });

        </script>
