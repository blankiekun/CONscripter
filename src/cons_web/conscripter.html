<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <meta cons_js="conscripter.js">
        <meta cons_index="cons_index.json">
        <title>CONscripter v0.32.1</title>
    </head>
    <body style="margin: 0 auto; background-color:black;">
        <canvas id="canvas" oncontextmenu="event.preventDefault()" style="margin: 0 auto; display: block; touch-action: none;"></canvas> 
        <video id="video" onended="videoEnded()" style="margin: 0 auto; display: none; touch-action: none;"></video>        
        <script type="text/javascript"> // browser universe function
            function scale_full(docobj, ratio=0) {
                var w = window.innerWidth;
                var h = window.innerHeight;
                if(ratio>0) {
                    if(w/h > ratio) {
                        docobj.style.width  = h * ratio  + "px";
                        docobj.style.height = h + "px";
                    }
                    else {
                        docobj.style.width  = w  + "px";
                        docobj.style.height = w / ratio + "px";
                    }
                }
                else {
                    docobj.style.width  = w + "px";
                    docobj.style.height = h + "px";
                }
                return {w: docobj.style.width, h: docobj.style.height}
            }
            
            async function delay(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            async function send_worker(worker, data) {
                worker.postMessage(data);
                return new Promise((res)=>{
                    worker.onmessage = (event)=>{
                        res(event.data);
                    };
                })
            };

            async function load_json(url) {
                return new Promise((res)=>{
                    fetch(url).then((res)=>res.json())
                    .then((json)=>(res(json)));
                })
            }

            async function load_js(url) {
                var script = document.createElement('script');
                script.type = "text/javascript";
                script.src = url;
                document.getElementsByTagName("body")[0].appendChild(script);
                return new Promise((res)=>{
                    script.onload = () =>{
                        res(1);
                    }
                })
            }

            async function download_data (name, data) {
                var blob = new Blob([data], {type:'application/octet-stream'});
                var e = document.createEvent('MouseEvents');
                var a = document.createElement('a');
                a.download = name;
                a.href = window.URL.createObjectURL(blob);
                a.dataset.downloadurl = ['application/octet-stream', a.download, a.href].join(':');
                e.initMouseEvent('click', true, false, window, 0, 0, 0, 0, 0, false, false, false, false, 0, null);
                a.dispatchEvent(e);
            }

            async function upload_data() {
                return new Promise((res, rej) => {
                    var i = document.createElement('input');
                    i.type = 'file';
                    i.addEventListener('change', () => {
                        var file = i.files[0];
                        var reader = new FileReader();
                        reader.onload = (e) => {
                            return res(e.target.result)
                        };
                        reader.readAsArrayBuffer(file);
                    });
                    i.click(); //can not open without user click
                });
            }
        </script>
        
        <script type="text/javascript" src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
        <script type="text/javascript"> // cons web function 
            function em_mkdirs(_FS, path) {
                var tmpdir="";
                var arr = path.split('/');
                for(i in arr)
                {
                    tmpdir += arr[i] +"/";
                    if(arr[i]=="") continue;
                    try{
                        _FS.mkdir(tmpdir);
                    }
                    catch{};
                }
            }

            function em_lsfiles(_FS, top) {
                var files = [];
                var paths = _FS.readdir(top);
                for(let i=0; i < paths.length; i++) {
                    paths[i] = top + "/" + paths[i];
                }
                while(paths.length > 0) {
                    path = paths.pop();
                    if(path.endsWith(".") || path.endsWith("..")) continue;
                    const stat = _FS.stat(path);
                    if (_FS.isDir(stat.mode)) {
                        let tmppaths = _FS.readdir(path);
                        for (let i=0; i<tmppaths.length; i++) {
                            paths.push(path + "/" + tmppaths[i]);
                        }
                    }
                    else if (_FS.isFile(stat.mode)) {
                        files.push(path);   
                    }
                    else if (_FS.isLink(stat.mode)) {
                        // not consider symbol link here
                    }
                }
                return files;
            }

            function em_export(_FS, paths, name="export.zip") {
                var zip = new JSZip();
                for (let i=0; i<paths.length; i++) {
                    var data = _FS.readFile(paths[i]);
                    zip.file(paths[i], data, {binary: true});
                    console.log("## cons_fs: em_export", paths[i]);
                }
                zip.generateAsync({type : "arraybuffer"})
                .then(function(data) {
                    download_data(name, data);
                });
            }

            function em_import(_FS, data) {
                JSZip.loadAsync(data)
                .then((zip) => {
                    zip.forEach((path, obj) => {
                        if(obj.dir) {
                            em_mkdirs(_FS, path);
                        }
                        else {
                            obj.async("arraybuffer")
                            .then((buf) => {
                                _FS.writeFile(path, new Uint8Array(buf));
                                console.log("## cons_fs: em_import", path);
                            });
                        }
                    });
                })
            }

            // mount --gamedir other by preload or lazyload
            var g_cons_archives = []; // [dir, name, url] of the archives read by range
            function mount_game(_FS, gamedir, files, urlbase="", lazyload=false) {
                console.log("## cons_fs: mount_onsgame", gamedir);
                var filemap = {}
                
                if(gamedir[gamedir.length-1] =="/" ) 
                    gamedir=gamedir.substring(0, gamedir.length-1);

                if(urlbase[urlbase.length-1] == "/")
                    urlbase=urlbase.substring(0, urlbase.length-1);

                for(i in files) {
                    var path = files[i].path;
                    var url = files[i].url;
                    var file_lazyload = files[i].lazyload;
                    var j = path.lastIndexOf("/");
                    var filename =path.substring(j+1);
                    var filedir = path.substring(0, j);
                    var basedir = gamedir + "/" + filedir;
                    if(basedir[basedir.length-1]!="/") basedir+="/";
                    if(url==undefined || url.length==0)
                    {
                        if (path[0]=="/") url = urlbase + path;
                        else url = urlbase + "/" + path;
                    }

                    // console.log(path, url, file_lazyload);
                    em_mkdirs(_FS, basedir);
                    if(file_lazyload==undefined) file_lazyload = lazyload;
                    if(file_lazyload && (files[i].range || /\.(nsa|ns2|sar|npa)$/i.test(filename))){
                        g_cons_archives.push([basedir, filename, url]); // read by range (mount_archive)
                    }
                    else if(file_lazyload){ // pay attension to the case sensitive!
                        var key = basedir + filename;
                        filemap[key.toLowerCase()] = {url: url, loaded:false};
                    }
                    else {
                        _FS.createPreloadedFile(basedir, filename, url, true, false);
                    }
                }
                return filemap;
            }

            // mount --gamedir using BrowserFS with lazyload, 
            // deprecated as sync block sound problems
            function mount_game2(_module, gamedir, lazyindex, urlbase) {
                console.log("## cons_fs: mount_onsgame2", gamedir);
                var _FS=_module.FS;
                _module.addRunDependency("onsgamefs");
                
                var brewfs =  new BrowserFS.FileSystem.MountableFileSystem();
                var xhrfs = new BrowserFS.FileSystem.XmlHttpRequest(lazyindex, urlbase);
                window.xhrfs = xhrfs;
                window.brewfs = brewfs;
                brewfs.mount('/xhrfs', xhrfs);
                BrowserFS.initialize(brewfs);
                var BREWFS = new BrowserFS.EmscriptenFS(_module.FS, _module.PATH); 
                
                em_mkdirs(_FS, gamedir);
                _FS.mount(BREWFS, {root: "/xhrfs"}, gamedir);
                _module.removeRunDependency("onsgamefs")
            }

            // mount --savedir using IDBFS
            function mount_save(_FS, _IDBFS, savedir) {
                console.log("## cons_fs: mount_onssave", savedir);
                em_mkdirs(_FS, savedir);
                _FS.mount(_IDBFS, {}, savedir);
                // the engine starts once the saves are read: a flush before then overlaps this syncfs
                g_cons_module.addRunDependency("onssavefs");
                _FS.syncfs(true, (err)=>{
                    if(err) console.log(err);
                    g_cons_module.removeRunDependency("onssavefs");
                });
            }
        </script>
        
        <script type="text/javascript"> // cons range: game files read on demand by HTTP Range
            // An archive (.nsa .ns2 .sar .npa) listed with lazyload, and a zip of the game
            // ("zip" in cons_index.json), are read by byte range (README, "Web"): only the
            // index (an archive's header, a zip's central directory) and the entries the
            // engine opens are fetched. Archives are FS nodes read from a block cache that
            // consPreload fills asynchronously (the engine sleeps meanwhile); a zip's other
            // files are fetched (and inflated) whole when opened, as lazyload does.
            // A server without Range: the whole file, as before.
            const CONS_BLOCK = 1 << 16; // bytes per cached archive block
            const CONS_CACHE_MAX = 64 << 20; // archive blocks kept, at most (more only for one bigger read)
            const CONS_ZIP_FILES_MAX = 256 << 20; // zip files kept in the FS, at most (the open one more)
            var g_range_cache = new Map(); // "source id:block" -> Uint8Array, least recently used first
            var g_range_bytes = 0;
            var g_range_pending = new Map(); // request key -> {done, error}
            var g_range_sources = 0;
            var g_range_stats = {requests: 0, bytes: 0, sync: 0}; // fetched by Range; reads that missed the cache
            var g_zip_files = []; // filemap nodes of zip files in the FS, oldest first
            var g_zip_bytes = 0;

            function cons_fail(msg) { // shown on the page: the game can't start
                console.error("## cons_range: " + msg);
                var p = document.querySelector("#cons_webinfo p");
                if (p) p.innerText = msg;
                document.getElementById("cons_webinfo").style.display = "block";
            }

            // bytes [start, end) of url by a Range request: {data, total}, or null when
            // the server answered with the whole file (no Range support)
            async function range_get(url, start, end) {
                var range = start < 0 ? `bytes=${start}` : `bytes=${start}-${end - 1}`;
                var resp = await fetch(url, {headers: {Range: range}});
                if (!resp.ok) throw new Error(`${url}: ${resp.status} ${resp.statusText}`);
                if (resp.status != 206) return {resp: resp};
                var data = new Uint8Array(await resp.arrayBuffer());
                var m = /\/(\d+)\s*$/.exec(resp.headers.get("Content-Range") || "");
                g_range_stats.requests++;
                g_range_stats.bytes += data.length;
                return {data: data, total: m ? Number(m[1]) : -1};
            }

            // a read source: bytes [base, base+size) of url, or of buf when the server has no Range
            function range_source(url, base, size, buf) {
                return {id: g_range_sources++, url: url, base: base, size: size, buf: buf};
            }
            function range_put(src, block, data) {
                var key = src.id + ":" + block;
                var old = g_range_cache.get(key);
                if (old) { g_range_bytes -= old.length; g_range_cache.delete(key); }
                g_range_cache.set(key, data);
                g_range_bytes += data.length;
            }
            function range_evict(keep) { // oldest blocks first, never those of the read in hand
                for (var [key, data] of g_range_cache) {
                    if (g_range_bytes <= CONS_CACHE_MAX) break;
                    if (keep.has(key)) continue;
                    g_range_cache.delete(key);
                    g_range_bytes -= data.length;
                }
            }
            // true when bytes [start, end) of src are cached; else starts fetching them
            // (one request for the missing blocks) and returns false until they are
            function range_ready(src, start, end) {
                if (src.buf || end <= start) return true;
                var b0 = Math.floor(start / CONS_BLOCK), b1 = Math.ceil(end / CONS_BLOCK);
                var keep = new Set(), first = -1, last = -1;
                for (var b = b0; b < b1; b++) {
                    var key = src.id + ":" + b;
                    keep.add(key);
                    var data = g_range_cache.get(key);
                    if (data) { g_range_cache.delete(key); g_range_cache.set(key, data); } // recently used
                    else { if (first < 0) first = b; last = b; }
                }
                if (first < 0) return true;
                var rkey = src.id + ":" + first + "-" + last, req = g_range_pending.get(rkey);
                if (req) {
                    if (!req.done) return false;
                    g_range_pending.delete(rkey);
                    if (req.error) return true; // the read then tries once more, synchronously, and fails
                    range_evict(keep);
                    return range_ready(src, start, end);
                }
                req = {done: false, error: null};
                g_range_pending.set(rkey, req);
                var lo = first * CONS_BLOCK, hi = Math.min(src.size, (last + 1) * CONS_BLOCK);
                range_get(src.url, src.base + lo, src.base + hi).then((r) => {
                    if (!r.data || r.data.length != hi - lo) throw new Error(`${src.url}: no Range answer`);
                    for (var b = first; b <= last; b++)
                        range_put(src, b, r.data.slice((b - first) * CONS_BLOCK, (b - first + 1) * CONS_BLOCK)); // own buffers: each block can go
                }).catch((err) => {
                    console.error("## cons_range: fetch", err);
                    req.error = err;
                }).finally(() => { req.done = true; });
                return false;
            }
            // a read that missed the cache (no consPreload before it): one block, synchronously
            function range_sync(src, block) {
                g_range_stats.sync++;
                var lo = block * CONS_BLOCK, hi = Math.min(src.size, lo + CONS_BLOCK);
                console.warn(`## cons_range: synchronous read of ${src.url} at ${src.base + lo}`);
                var xhr = new XMLHttpRequest();
                xhr.open("GET", src.url, false);
                xhr.overrideMimeType("text/plain; charset=x-user-defined");
                xhr.setRequestHeader("Range", `bytes=${src.base + lo}-${src.base + hi - 1}`);
                xhr.send(null);
                if (xhr.status != 206 || xhr.responseText.length != hi - lo)
                    throw new g_cons_module.FS.ErrnoError(29); // EIO
                var text = xhr.responseText, data = new Uint8Array(hi - lo);
                for (var i = 0; i < data.length; i++) data[i] = text.charCodeAt(i) & 0xff;
                g_range_stats.requests++;
                g_range_stats.bytes += data.length;
                range_put(src, block, data);
                return data;
            }
            function range_read(src, buffer, offset, length, position) {
                if (position >= src.size) return 0;
                length = Math.min(length, src.size - position);
                if (src.buf) {
                    buffer.set(src.buf.subarray(src.base + position, src.base + position + length), offset);
                    return length;
                }
                var done = 0;
                while (done < length) {
                    var p = position + done, b = Math.floor(p / CONS_BLOCK);
                    var data = g_range_cache.get(src.id + ":" + b);
                    if (!data) {
                        if (done) break; // a short read: the rest comes with the next one
                        data = range_sync(src, b);
                    }
                    var o = p - b * CONS_BLOCK, n = Math.min(data.length - o, length - done);
                    buffer.set(data.subarray(o, o + n), offset + done);
                    done += n;
                }
                return done;
            }
            // the file dir/name, read from src
            function range_node(_FS, dir, name, src) {
                em_mkdirs(_FS, dir);
                var node = _FS.createFile(dir, name, {}, true, false);
                node.cons_src = src;
                Object.defineProperty(node, "usedBytes", {get: () => src.size});
                var read = (stream, buffer, offset, length, position) =>
                    range_read(src, buffer, offset, length, position);
                node.stream_ops = Object.assign({}, node.stream_ops, {read: read});
                return node;
            }
            // the engine asks before each read of a game file (COMMANDS.md, "Web hooks")
            self.consPreload = self.consPreload || ((fd, offset, length) => {
                var stream = g_cons_module.FS.getStream(fd);
                var src = stream && stream.node.cons_src;
                if (!src) return true;
                var end = length == 0xffffffff ? src.size : Math.min(src.size, offset + length);
                return range_ready(src, offset, end);
            });

            // an archive listed with lazyload: a node read by range, else (no Range) the
            // whole file when opened, as lazyload does
            async function mount_archive(_FS, dir, name, url, filemap) {
                var r = await range_get(url, 0, CONS_BLOCK).catch((err) => {
                    console.log(`## cons_range: ${url}`, err); return null;
                });
                if (!r) return;
                if (r.resp) {
                    r.resp.body.cancel();
                    console.log(`## cons_range: ${url} has no Range support: fetched whole when opened`);
                    filemap[(dir + name).toLowerCase()] = {url: url, loaded: false};
                    return;
                }
                var src = range_source(url, 0, r.total);
                range_put(src, 0, r.data);
                range_node(_FS, dir, name, src);
            }

            // a zip of the game: each file is fetched when opened (fetch_file); an archive in
            // it must be stored, and is then read by range like mount_archive's
            async function mount_zip(_FS, gamedir, url, filemap) {
                var u16 = (d, o) => d[o] | d[o + 1] << 8;
                var u32 = (d, o) => (d[o] | d[o + 1] << 8 | d[o + 2] << 16 | d[o + 3] << 24) >>> 0;
                var u64 = (d, o) => u32(d, o) + u32(d, o + 4) * 0x100000000;
                var z = {url: url, buf: null, size: 0};
                var tail = await range_get(url, -(65536 + 22));
                var tail_at;
                if (tail.resp) { // no Range: the whole zip, kept
                    console.log(`## cons_range: ${url} has no Range support: fetched whole`);
                    z.buf = new Uint8Array(await tail.resp.arrayBuffer());
                    z.size = z.buf.length;
                    tail = z.buf; tail_at = 0;
                }
                else { z.size = tail.total; tail = tail.data; tail_at = z.size - tail.length; }
                z.read = async (start, end) => {
                    if (z.buf) return z.buf.subarray(start, end);
                    if (start >= tail_at) return tail.subarray(start - tail_at, end - tail_at);
                    return (await range_get(url, start, end)).data;
                };
                var e = tail.length - 22;
                while (e >= 0 && u32(tail, e) != 0x06054b50) e--;
                if (e < 0) throw new Error(`${url}: not a zip`);
                var count = u16(tail, e + 10), cd_size = u32(tail, e + 12), cd_at = u32(tail, e + 16);
                if (e >= 20 && u32(tail, e - 20) == 0x07064b50) { // zip64
                    var z64 = await z.read(u64(tail, e - 12), u64(tail, e - 12) + 56);
                    count = u64(z64, 32); cd_size = u64(z64, 40); cd_at = u64(z64, 48);
                }
                var cd = await z.read(cd_at, cd_at + cd_size), names = new TextDecoder();
                var entries = [];
                for (var p = 0, i = 0; i < count && u32(cd, p) == 0x02014b50; i++) {
                    var n = u16(cd, p + 28), x = u16(cd, p + 30), c = u16(cd, p + 32);
                    var ent = {method: u16(cd, p + 10), csize: u32(cd, p + 20), size: u32(cd, p + 24),
                        at: u32(cd, p + 42), name: names.decode(cd.subarray(p + 46, p + 46 + n)), zip: z};
                    for (var q = p + 46 + n; q + 4 <= p + 46 + n + x; q += 4 + u16(cd, q + 2)) {
                        if (u16(cd, q) != 1) continue; // zip64 sizes and offset, those that didn't fit
                        var r = q + 4;
                        if (ent.size == 0xffffffff) { ent.size = u64(cd, r); r += 8; }
                        if (ent.csize == 0xffffffff) { ent.csize = u64(cd, r); r += 8; }
                        if (ent.at == 0xffffffff) ent.at = u64(cd, r);
                    }
                    ent.extra = x;
                    entries.push(ent);
                    p += 46 + n + x + c;
                }
                // a zip of the game's folder: the folder's files are the game's
                var top = entries.length && entries[0].name.split("/")[0] + "/";
                if (!entries.every((ent) => ent.name.startsWith(top))) top = "";
                var archives = [];
                for (var ent of entries) {
                    var path = ent.name.substring(top.length);
                    if (path == "" ) continue;
                    var j = path.lastIndexOf("/"), dir = gamedir + "/" + path.substring(0, j + 1);
                    if (path.endsWith("/")) { em_mkdirs(_FS, dir); continue; }
                    em_mkdirs(_FS, dir);
                    var name = path.substring(j + 1);
                    if (/\.(nsa|ns2|sar|npa)$/i.test(name)) archives.push([dir, name, ent]);
                    else filemap[(dir + name).toLowerCase()] = {entry: ent, loaded: false};
                }
                for (var [dir, name, ent] of archives) {
                    if (ent.method != 0)
                        throw new Error(`${name} in ${url} is compressed: an archive in a zip must be ` +
                            `stored, make the zip with zip -0 (or zip -n .nsa:.ns2:.sar)`);
                    var h = await z.read(ent.at, ent.at + 30);
                    var base = ent.at + 30 + u16(h, 26) + u16(h, 28);
                    var src = range_source(url, base, ent.size, z.buf);
                    if (!z.buf) range_put(src, 0, await z.read(base, base + Math.min(ent.size, CONS_BLOCK)));
                    range_node(_FS, dir, name, src);
                }
                console.log(`## cons_range: ${url}: ${entries.length} entries, ${archives.length} archives`);
            }

            // a zip file's bytes, inflated when deflated
            async function zip_file(ent) {
                var z = ent.zip, u16 = (d, o) => d[o] | d[o + 1] << 8;
                var guess = 30 + ent.name.length * 3 + ent.extra + 256; // the local header's extra may differ
                var head = await z.read(ent.at, Math.min(z.size, ent.at + guess + ent.csize));
                var start = 30 + u16(head, 26) + u16(head, 28);
                var data = head.length >= start + ent.csize ? head.subarray(start, start + ent.csize)
                    : await z.read(ent.at + start, ent.at + start + ent.csize);
                if (ent.method == 0) return data;
                if (ent.method != 8) throw new Error(`${ent.name}: zip method ${ent.method}`);
                var stream = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
                return new Uint8Array(await new Response(stream).arrayBuffer());
            }
            // a zip file written to the FS; the oldest go once they pass CONS_ZIP_FILES_MAX
            // (an open one stays readable; opened again, it is fetched again)
            function zip_keep(_FS, path, fnode, size) {
                fnode.size = size;
                g_zip_files.push([path, fnode]);
                g_zip_bytes += size;
                while (g_zip_bytes > CONS_ZIP_FILES_MAX && g_zip_files.length > 1) {
                    var [old, onode] = g_zip_files.shift();
                    g_zip_bytes -= onode.size;
                    onode.loaded = false;
                    try { _FS.unlink(old); } catch (e) {}
                }
            }
        </script>
        
        <script type="text/javascript"> // cons C interface of val or function
            
            // flush the savedir to IDFBFS for persistence, one syncfs at a time:
            // a flush asked for while one runs is done once it finishes
            var g_flush_busy = false, g_flush_again = false;
            function flush_save() {
                if(g_flush_busy) { g_flush_again = true; return; }
                g_flush_busy = true;
                g_cons_module.FS.syncfs(false, (err)=>{
                    if(err) console.log(err);
                    else console.log("## cons_fs: flush_save, sync finished");
                    g_flush_busy = false;
                    if(g_flush_again) { g_flush_again = false; flush_save(); }
                });
            }

            // the page hidden (a phone may discard it without unload): gloval.sav, kidoku.dat and the rest now
            function cons_persist() { if (g_cons_module._consPersist) g_cons_module._consPersist(); }
            document.addEventListener('visibilitychange', ()=>{ if (document.hidden) cons_persist(); });
            window.addEventListener('pagehide', cons_persist);

            // fetch file from the remote server, and write them to local fs
            async function fetch_file(_FS, path, filemap) {
                var fnode = filemap[path];
                return new Promise((res)=>{
                    if(!fnode){
                        res(0);
                    }
                    else{
                        if(fnode.loaded) { res(1); return; }
                        if(fnode.entry) { // a file in the game's zip
                            zip_file(fnode.entry).then((data)=>{
                                _FS.writeFile(path, data);
                                zip_keep(_FS, path, fnode, data.length);
                                fnode.loaded = true;
                                res(1);
                            }).catch((err)=>{
                                console.log(`## fetch_file ${path}`, err);
                                fnode.loaded = true;
                                res(-1);
                            });
                            return;
                        }
                        fetch(fnode.url).then( (resp)=>{
                            if(!resp.ok) throw new Error(resp.status + " " + resp.statusText);
                            return resp.arrayBuffer();
                        }).then((data)=>{
                            _FS.writeFile(path, new Uint8Array(data));
                            fnode.loaded = true;
                            res(1);
                        }).catch((err)=>{
                            console.log(`## fetch_file ${path}`, err);
                            fnode.loaded = true; // settled: fopen_ons stops waiting and finds no file
                            res(-1);
                        })
                    }
                })
            }
    
            const CONS_PREFIX = ""; // prefix for mount, not used 
            const CONS_INDEX_URL = document.querySelector( // the url to load cons_index.json
                'meta[cons_index]').attributes.cons_index.textContent;
            const CONS_JS_URL = document.querySelector(
                'meta[cons_js]').attributes.cons_js.textContent;
            var g_cons_index = {}; // cons_index.json, game file index
            var g_cons_filemap = {}; // filemap to record status of loaded files, used for lazyload
            var g_cons_module  = {}; // cons c module, FS and configure are here

        </script>

        <script type="text/javascript"> // cons module
            g_cons_module.canvas = (()=>{return document.getElementById('canvas');})();
            g_cons_module.preRun = () => {
                console.log("## cons: preRun");
                var lazyload = false;
                var urlbase = window.location.href;
                urlbase = urlbase.substring(0, urlbase.lastIndexOf("/") + 1);
                
                // lazyindex is deprecated as the sync sound problem
                if(g_cons_index.lazyindex && g_cons_index.lazyindex!=""){
                    mount_game2(g_cons_module, g_cons_index.gamedir, 
                        g_cons_index.lazyindex, urlbase);
                }
                else{
                    lazyload = g_cons_index.lazyload||lazyload;
                    window.g_cons_filemap = mount_game(
                        g_cons_module.FS, g_cons_index.gamedir, 
                        g_cons_index.files, urlbase, lazyload
                    );
                }
                // the archives read by range, the game's zip: their indexes before the engine starts
                g_cons_module.addRunDependency("cons_range");
                (async () => {
                    var filemap = window.g_cons_filemap = window.g_cons_filemap || {};
                    for (var [dir, name, url] of g_cons_archives)
                        await mount_archive(g_cons_module.FS, dir, name, url, filemap);
                    if (g_cons_index.zip)
                        await mount_zip(g_cons_module.FS, g_cons_index.gamedir.replace(/\/$/, ""),
                            new URL(g_cons_index.zip, urlbase).href, filemap);
                    // a language's own font (default.<lang>.ttf, COMMANDS.md "language"): fetched now, so a switch doesn't wait for it
                    for (var key in filemap)
                        if (/\/default\.[^\/.]+\.ttf$/.test(key)) fetch_file(g_cons_module.FS, key, filemap);
                    g_cons_module.removeRunDependency("cons_range");
                })().catch((err) => cons_fail(err.message || String(err)));
                mount_save(g_cons_module.FS, g_cons_module.IDBFS, g_cons_index.savedir);
            };
            g_cons_module.onRuntimeInitialized = () => {
                console.log("## cons: onRuntimeInitialized");
            };
            
            (async() => {
                //return
                g_cons_index = await load_json(CONS_INDEX_URL);
                await load_js(CONS_JS_URL); // dynamic load conscripter.js
                await cons(g_cons_module);

                var args = [
                    "--root", CONS_PREFIX + g_cons_index.gamedir, 
                    "--font",  CONS_PREFIX + g_cons_index.gamedir + "/default.ttf", 
                    "--save-dir", g_cons_index.savedir
                ];
                args = args.concat(g_cons_index.args);
                // the debug trace (DEBUG.md): ?trace, with ?trace-ignore=, ?auto-play=,
                // ?auto-choice=, ?seed=, ?until=, ?max-pages=; the page keeps the records for "trace[F7]"
                var params = new URLSearchParams(window.location.search);
                if(params.has("trace")){
                    args.push("--trace", "/trace.jsonl");
                    self.consTrace = (line) => { g_trace_lines.push(line); };
                    document.getElementById("cons_trace_button").style.display = "";
                }
                for(var name of ["trace-ignore", "auto-play", "auto-choice", "seed", "until", "max-pages"]){
                    if(params.get(name) !== null) args.push("--" + name, params.get(name));
                }
                console.log("## cons: args", args);
                g_cons_module.callMain(args);
            })();
        </script>

        <script type="text/javascript"> // cons ui
            var g_fullstrech = false;
            var g_screen_height, g_screen_width; // initial in the engine's C code
            var g_lastpressdown; // for longpress 
            const LONG_CLICK_TIME = 1200;

            function toggle_stretchfull() {
                g_fullstrech = !g_fullstrech;
                window.dispatchEvent(new Event('resize'));
            }

            function toggle_screenfull() {
                var body = document.getElementsByTagName('body')[0];
                if(window.innerHeight != screen.height) {
                    body.requestFullscreen({ navigationUI: "show" })
                    .then(()=>{ // can not use canvas.requestFullscreen
                        console.log("## after requestFullscreen");
                        // landscape on phones; only in fullscreen on Android, iOS has no lock
                        if(screen.orientation && screen.orientation.lock)
                            screen.orientation.lock('landscape').catch(()=>{});
                    });
                }
                else {
                    document.exitFullscreen();
                }
            }

            function toggle_onsmenu(){
                var canvas = document.getElementById('canvas');    
                var event = new KeyboardEvent("keydown", 
                    {bubbles: true, cancelable: true, keyCode: 0x1B}); // ESC key
                canvas.dispatchEvent(event);
                setTimeout(() => {
                    var event = new KeyboardEvent("keyup", 
                    {bubbles: true, cancelable: true, keyCode: 0x1B}); // ESC key
                    canvas.dispatchEvent(event);
                }, 50);
            }

            var g_skip = false;
            function toggle_skip() {
                g_skip = !g_skip;
                var canvas = document.getElementById('canvas');    
                var event = new KeyboardEvent(g_skip ? "keydown": "keyup", 
                    {bubbles: true, cancelable: true, keyCode: 0x11}); // ctrl key
                canvas.dispatchEvent(event);
            }

            function toggle_webinfo() {
                var cons_webinfo = document.getElementById("cons_webinfo");
                if(cons_webinfo.style.display=="none") {
                    var first_line = cons_webinfo.getElementsByTagName("p")[0];
                    first_line.innerText = `In Game <${g_cons_index.title}>`
                    cons_webinfo.style.display="block";
                }
                else{
                    cons_webinfo.style.display="none";
                }
            }

            function toggle_webmenu() {
                var cons_webrmenu = document.getElementById("cons_webrmenu");
                if(cons_webrmenu.style.display=="none") {
                    cons_webrmenu.style.display = "block";
                }
                else {
                    var cons_webinfo = document.getElementById("cons_webinfo");
                    cons_webinfo.style.display = "none";
                    cons_webrmenu.style.display = "none";
                }
            }

            function click_export() {
                var files = em_lsfiles(g_cons_module.FS, g_cons_index.savedir);
                em_export(g_cons_module.FS, files);
            }

            var g_trace_lines = []; // the debug trace's records (?trace)
            function click_trace() {
                if(!g_trace_lines.length) return;
                var blob = new Blob([g_trace_lines.join("\n") + "\n"], {type: "application/x-ndjson"});
                var a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = "trace.jsonl";
                a.click();
                setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            }

            async function click_import() {
                var data = await upload_data();
                em_import(g_cons_module.FS, data);
            }

            window.onresize = (event) => {
                var canvas = document.getElementById('canvas');
                var ratio = g_fullstrech ? window.innerWidth/window.innerHeight: g_screen_width/g_screen_height;
                scale_full(canvas, ratio);
            };

            window.onkeydown = (event) => {
                switch(event.key) {
                    case "F2":
                        toggle_webinfo();
                        break;
                    case "F3":
                        click_export();
                        break;
                    case "F4":
                        click_import();
                        break;
                    case "F7":
                        click_trace();
                        break;
                    case "F9":
                        toggle_webmenu();
                        break;
                    case "F10":
                        toggle_stretchfull();
                        break;
                    case "F11":
                        toggle_screenfull();
                        break;
                }
            }

            window.onmousedown = (event) => {
                if(event.button==0){
                    g_lastpressdown = event.timeStamp;
                }
            }

            window.onmouseup = (event) => {
                if(event.button==0){
                    if(event.timeStamp - g_lastpressdown > LONG_CLICK_TIME) {
                        var cons_webrmenu = document.getElementById("cons_webrmenu");
                        if(cons_webrmenu.style.display=="none") toggle_webmenu();
                        g_lastpressdown = event.timeStamp;
                    }
                }
            }

            window.ontouchstart = (event) => {
                g_lastpressdown = event.timeStamp;
            }

            window.ontouchend = (event) => {
                if(event.timeStamp - g_lastpressdown > LONG_CLICK_TIME) {
                    var cons_webrmenu = document.getElementById("cons_webrmenu");
                    if(cons_webrmenu.style.display=="none") toggle_webmenu();
                    g_lastpressdown = event.timeStamp;
                }
            }

            window.onmessage = (evnet)=> {
                console.log("## cons: onmessage ", event.data);
                if(!event.data) return;
                switch(event.data) {
                    case "onsinit":
                        var body = document.getElementsByTagName("body")[0];
                        var cons_webinfo = document.getElementById("cons_webinfo");
                        if(body) body.style.background = "black";
                        if(cons_webinfo) cons_webinfo.style.display = "none";
                        break;
                }
            }
        </script>
        
        <script type="text/javascript"> // cons video 
            const video=document.getElementById("video");

            // a skipped movie must stop: hiding it and clearing src leaves
            // its sound playing in some browsers
            var g_video_skippable=false;
            function videoSkipped(){
                g_cons_module.video_skipped=true;
                videoEnded();
            }
            function videoEnded(){
                holdEnded();
                g_video_skippable=false;
                video.onclick=null;
                video.pause();
                g_cons_module.canvas.style.display="block";
                video.style.display="none";
                if (video.src && video.src.startsWith('blob:')) {
                    URL.revokeObjectURL(video.src);
                }
                video.removeAttribute('src');
                video.load();
                g_cons_module.wait_video=false;
            }

            // Enter, Space and Escape skip it, as in the native player
            window.addEventListener('keyup', function(event) {
                if (g_video_skippable && (event.key=="Enter" || event.key==" " || event.key=="Escape")) videoSkipped();
            });

            function playVideo(path, click_flag, loop_flag){
                g_cons_module.wait_video=true;
                g_cons_module.video_skipped=false;
                const fileData = g_cons_module.FS.readFile(path, {flags:'r',encoding:'binary'});
                const videoBlob = new Blob([fileData.buffer], { type: 'video/mp4' });
                const videoUrl = URL.createObjectURL(videoBlob);
                video.src = videoUrl;

                // the same size as the game on the page
                const canvas=g_cons_module.canvas;
                video.style.width=canvas.style.width||canvas.clientWidth+"px";
                video.style.height=canvas.style.height||canvas.clientHeight+"px";
                canvas.style.display="none";
                video.style.display="block";

                video.onclick=click_flag?videoSkipped:null;
                g_video_skippable=!!click_flag;
                video.loop=loop_flag;

                // browsers block autoplay with sound until the page was clicked;
                // play muted then, rather than wait forever
                video.muted=false;
                video.play().catch(()=>{
                    video.muted=true;
                    video.play().catch(videoEnded);
                });
            }

            // mpeghold: the video plays while the pointer, Enter or Space
            // is held down on it, under the engine's sprite (a "hold the
            // button" prompt); g_cons_module.video_held tells the engine
            const holdOverlay=document.createElement("canvas");
            holdOverlay.style.cssText="position:absolute; display:none; touch-action:none;";
            document.body.appendChild(holdOverlay);
            var g_hold=null;
            function holdSet(){
                if (!g_hold) return;
                const down=g_hold.pointers.size>0 || g_hold.keys.size>0;
                if (down==!!g_cons_module.video_held) return;
                g_cons_module.video_held=down;
                if (down) video.play().catch(()=>{ video.muted=true; video.play().catch(()=>{}); });
                else video.pause();
            }
            function holdKey(event){
                if (!g_hold || !(event.key=="Enter" || event.key==" ")) return;
                event.preventDefault();
                if (event.type=="keydown") g_hold.keys.add(event.key); else g_hold.keys.delete(event.key);
                holdSet();
            }
            window.addEventListener('keydown', holdKey);
            window.addEventListener('keyup', holdKey);
            holdOverlay.addEventListener('pointerdown', function(event){
                if (!g_hold || event.button>0) return;
                holdOverlay.setPointerCapture(event.pointerId);
                g_hold.pointers.add(event.pointerId);
                holdSet();
            });
            for (const name of ['pointerup', 'pointercancel', 'lostpointercapture'])
                holdOverlay.addEventListener(name, function(event){
                    if (!g_hold) return;
                    g_hold.pointers.delete(event.pointerId);
                    holdSet();
                });
            holdOverlay.addEventListener('contextmenu', (event)=>event.preventDefault());
            window.addEventListener('blur', function(){
                if (!g_hold) return;
                g_hold.pointers.clear();
                g_hold.keys.clear();
                holdSet();
            });

            // rgba: the sprite's picture (w x h, stride px a row), cells side
            // by side, each shown ms; drawn at x,y of the sw x sh screen
            function playVideoHold(path, rgba, w, h, stride, cells, ms, x, y, sw, sh){
                g_cons_module.wait_video=true;
                g_cons_module.video_held=false;
                g_cons_module.video_hold_end=0;
                const fileData = g_cons_module.FS.readFile(path, {flags:'r',encoding:'binary'});
                video.src = URL.createObjectURL(new Blob([fileData.buffer], { type: 'video/mp4' }));
                video.loop=false;
                video.muted=false;
                video.onclick=null;
                g_video_skippable=false;
                video.preload="auto";
                video.pause();

                const canvas=g_cons_module.canvas;
                video.style.width=canvas.style.width||canvas.clientWidth+"px";
                video.style.height=canvas.style.height||canvas.clientHeight+"px";
                canvas.style.display="none";
                video.style.display="block";
                const r=video.getBoundingClientRect();
                Object.assign(holdOverlay.style, {left:(r.left+window.scrollX)+"px", top:(r.top+window.scrollY)+"px",
                                                  width:r.width+"px", height:r.height+"px", display:"block"});
                holdOverlay.width=sw;
                holdOverlay.height=sh;
                const ctx=holdOverlay.getContext("2d");
                ctx.clearRect(0, 0, sw, sh);
                g_hold={pointers:new Set(), keys:new Set(), timer:null};
                if (rgba && w>0 && h>0){
                    const image=new ImageData(w, h);
                    for (let row=0; row<h; row++)
                        image.data.set(rgba.subarray(row*stride*4, row*stride*4 + w*4), row*w*4);
                    const cw=Math.floor(w/Math.max(cells,1));
                    let cell=0;
                    const draw=()=>{
                        ctx.clearRect(0, 0, sw, sh);
                        ctx.putImageData(image, x - cell*cw, y, cell*cw, 0, cw, h);
                        cell=(cell+1)%Math.max(cells,1);
                    };
                    draw();
                    if (cells>1 && ms>0) g_hold.timer=setInterval(draw, ms);
                }
            }
            function holdEnded(){
                if (!g_hold) return;
                g_cons_module.video_hold_end=(g_hold.pointers.size>0 ? 1 : 0) | (g_hold.keys.has("Enter") ? 2 : 0) | (g_hold.keys.has(" ") ? 8 : 0);
                if (g_hold.timer) clearInterval(g_hold.timer);
                g_hold=null;
                g_cons_module.video_held=false;
                holdOverlay.style.display="none";
            }

            // CONscripter: movies whose frames the engine draws (a movie as a
            // picture; mpegplay under the text window): a hidden <video> each,
            // its current frame read through a canvas as RGBA bytes
            var g_cons_movies={}, g_cons_movie_id=0;
            function consMovieOpen(path, loop, sound, w, h){
                var data;
                try { data=g_cons_module.FS.readFile(path, {flags:'r',encoding:'binary'}); }
                catch(e){ console.error('no movie '+path); return -1; }
                const v=document.createElement('video');
                const id=++g_cons_movie_id;
                const m={video:v, state:0, last:-1, w:w, h:h, ctx:null};
                v.muted=!sound; v.loop=!!loop; v.playsInline=true; v.preload='auto';
                // in the page (a detached or hidden video may not decode), unseen
                v.style.cssText='position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none';
                v.onloadeddata=function(){ if (m.state==0) m.state=1; };
                v.onerror=function(){ m.state=-1; };
                v.src=URL.createObjectURL(new Blob([data.buffer]));
                document.body.appendChild(v);
                v.play().catch(function(){ v.muted=true; v.play().catch(function(){ m.state=-1; }); });
                g_cons_movies[id]=m;
                return id;
            }
            function consMovieState(id){ const m=g_cons_movies[id]; return m ? m.state : -1; }
            // the frame as RGBA bytes when it changed since the last call, else null
            function consMovieFrame(id, w, h){
                const m=g_cons_movies[id];
                if (!m || m.video.readyState<2 || m.video.currentTime===m.last) return null;
                m.last=m.video.currentTime;
                if (!m.ctx){
                    const c=document.createElement('canvas');
                    c.width=w; c.height=h;
                    m.ctx=c.getContext('2d', {willReadFrequently:true});
                }
                m.ctx.drawImage(m.video, 0, 0, w, h);
                return m.ctx.getImageData(0, 0, w, h).data;
            }
            function consMovieEnded(id){ const m=g_cons_movies[id]; return !m || m.state<0 || m.video.ended ? 1 : 0; }
            function consMovieClose(id){
                const m=g_cons_movies[id];
                if (!m) return;
                const v=m.video;
                v.pause();
                if (v.src && v.src.startsWith('blob:')) URL.revokeObjectURL(v.src);
                v.removeAttribute('src');
                v.load();
                v.remove();
                delete g_cons_movies[id];
            }

            video.addEventListener('error', function(event) {
                console.error('The video failed to load: ', event);
                videoEnded();
            });

        </script>
